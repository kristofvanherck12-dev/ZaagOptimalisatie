<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b50"><title>Mijn Zaagapp</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f8;color:#183747;font:17px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#123b50;color:white;padding:19px 16px}header h1{margin:0;font-size:24px}main{max-width:720px;margin:auto;padding:15px}.card{background:white;border-radius:14px;padding:17px;margin:13px 0;box-shadow:0 2px 12px #123b5016}button,select{font:inherit;border-radius:10px;padding:14px;border:1px solid #b8cbd3}button{background:#126b83;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#e5eff3;color:#164154}button.good{background:#28764b}button.wide{width:100%;margin:6px 0}select{width:100%;background:white}.muted{color:#526a75;font-size:14px}.big{font-size:48px;font-weight:800;text-align:center;margin:12px 0}.angle{font-size:24px;text-align:center}.row{display:flex;gap:10px}.row>*{flex:1}.hidden{display:none}.item{border-bottom:1px solid #e0e8ec;padding:10px 0}.item:last-child{border:0}.progress{height:12px;border-radius:12px;background:#dbe6eb;overflow:hidden}.progress>div{height:100%;background:#23855d;width:0}a{color:#126b83}#msg{white-space:pre-wrap}small{font-size:13px}
</style></head><body><header><h1>🪚 Mijn Zaagapp</h1><div>Zaaglijst & Start Cutting</div></header><main>
<section class="card"><strong>1. Kies je project</strong><p class="muted">Laad je project rechtstreeks uit Google Drive, of kies een gedownload projectbestand (.json).</p><button id="connect" class="wide">🔗 Google Drive verbinden</button><button id="load" class="wide alt">📁 Projecten uit Drive tonen</button><select id="projects" class="hidden" aria-label="Kies project"></select><button id="open" class="wide hidden">Open gekozen project</button><button id="fileBtn" class="wide alt">📄 Projectbestand openen (.json)</button><input type="file" id="file" accept=".json,application/json" class="hidden"><p id="msg" class="muted" role="status"></p></section>
<section id="project" class="card hidden"><h2 id="name"></h2><p id="details" class="muted"></p><h3>Zaaglijst</h3><div id="list"></div><button id="start" class="wide good">▶ Start Cutting</button></section>
<section id="cut" class="card hidden"><h2>Start Cutting</h2><div id="count"></div><div class="progress"><div id="bar"></div></div><p id="profile" style="font-weight:700"></p><p id="stock"></p><div id="length" class="big"></div><div id="angle" class="angle"></div><p id="position" class="muted"></p><div class="row"><button id="prev" class="alt">← Vorige</button><button id="done" class="good">✓ Gezaagd · Volgende</button></div><button id="next" class="wide alt">Volgende zonder afvinken →</button><button id="back" class="wide alt">Terug naar zaaglijst</button></section>
<p class="muted">Je voortgang wordt op dit toestel onthouden. Controleer maten en verstek vóór het zagen.</p></main>
<script>
const CLIENT='1077983441875-1iqlpds12jbobgujnq2kumgq8pb882fd.apps.googleusercontent.com',ROOT='1cXBz-cMZokRsibgVuoRwix3TOr2UOAx4';
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
let token='',expiry=0,folders=[],project=null,steps=[],index=0,progressKey='';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scriptPromise=null;
function googleReady(){if(window.google?.accounts?.oauth2)return Promise.resolve();if(scriptPromise)return scriptPromise;return scriptPromise=new Promise((ok,fail)=>{let t=document.createElement('script');t.src='https://accounts.google.com/gsi/client';t.onload=ok;t.onerror=()=>{scriptPromise=null;fail(Error('Google kon niet laden'))};document.head.append(t)})}
googleReady().catch(()=>{});
function login(){if(token&&Date.now()<expiry-60000)return Promise.resolve();if(!window.google?.accounts?.oauth2)return Promise.reject(Error('Google laadt nog. Wacht even en probeer opnieuw.'));return new Promise((ok,fail)=>{let finished=false;const resolve=r=>{if(finished)return;finished=true;token=r.access_token;expiry=Date.now()+(Number(r.expires_in)||3500)*1000;ok()},reject=e=>{if(finished)return;finished=true;fail(e)};const client=google.accounts.oauth2.initTokenClient({client_id:CLIENT,scope:'https://www.googleapis.com/auth/drive',callback:r=>r.access_token?resolve(r):reject(Error(r.error||'Geen toestemming ontvangen')),error_callback:e=>reject(Error('Google-aanmelding: '+(e.type||'onbekende fout')))});client.requestAccessToken({prompt:''})})}
async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok){let t='';try{t=(await r.json()).error?.message||''}catch(e){}throw Error('Google Drive '+r.status+': '+t)}return r}
async function list(parent,mime){const q="'"+parent+"' in parents and mimeType = '"+mime+"' and trashed = false";return (await(await api('https://www.googleapis.com/drive/v3/files?fields=files(id,name),nextPageToken&page_size=100&q='+encodeURIComponent(q))).json()).files||[]}
$('connect').onclick=async()=>{try{msg('Google verbinden…');await login();msg('✓ Google Drive verbonden. Klik nu op Projecten uit Drive tonen.')}catch(e){msg(e.message)}};
$('load').onclick=async()=>{try{msg('Projecten ophalen…');await login();folders=(await list(ROOT,'application/vnd.google-apps.folder')).sort((a,b)=>a.name.localeCompare(b.name,'nl'));if(!folders.length)throw Error('Geen projectmappen gevonden in Projecten.');$('projects').innerHTML=folders.map((f,i)=>'<option value="'+i+'">'+escapeHtml(f.name)+'</option>').join('');$('projects').classList.remove('hidden');$('open').classList.remove('hidden');msg(folders.length+' project(en) gevonden. Kies je project.')}catch(e){msg('Openen mislukt: '+e.message)}};
$('open').onclick=async()=>{try{const f=folders[Number($('projects').value)];if(!f)throw Error('Kies een project.');msg('Project laden…');const files=await list(f.id,'application/json'),item=files.find(x=>x.name.startsWith('Project - '));if(!item)throw Error('Geen projectbestand gevonden in '+f.name);const p=await(await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(item.id)+'?alt=media')).json();openProject(p.project);msg('Project '+f.name+' geopend.')}catch(e){msg('Openen mislukt: '+e.message)}};
$('fileBtn').onclick=()=>$('file').click();
$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const p=JSON.parse(await f.text());openProject(p.project||p);msg('Projectbestand geopend.')}catch(e){msg('Bestand openen mislukt: '+e.message)}};
function angles(a){const m=String(a||'').match(/([0-9]+(?:[.,][0-9]+)?)°\s*links\s*\/\s*([0-9]+(?:[.,][0-9]+)?)°\s*rechts/);return m?[Number(m[1].replace(',','.')),Number(m[2].replace(',','.'))]:[0,0]}
function angleLabel(a){if(Array.isArray(a))return a.join('° / ')+'°';return String(a||'Recht')}
function build(p){const stock=Number(p.stock)||6000,kerf=Number(p.kerf)||0;if(stock<=0||kerf<0)throw Error('Ongeldige staaflengte of zaagbreedte.');const groups=new Map();for(const x of p.pieces){const key=[x.material,x.shape,x.size].join(' | ');if(!groups.has(key))groups.set(key,[]);const qty=Number(x.qty)||0;if(qty>10000)throw Error('Te veel stukken.');for(let i=0;i<qty;i++)groups.get(key).push({length:Number(x.length),angles:angleLabel(x.angles)})}const result=[];for(const [profile,parts] of groups){const families=new Map();for(const part of parts){const [l,r]=angles(part.angles),a=l>0&&r===0?l:r>0&&l===0?r:0;if(!a)continue;const key=part.length+'|'+a;if(!families.has(key))families.set(key,[]);families.get(key).push(part)}for(const family of families.values())family.forEach((part,i)=>part.cutSide=([0,3].includes(i%4))?'links':'rechts');parts.sort((a,b)=>b.length-a.length);const bars=[];for(const part of parts){if(!Number.isFinite(part.length)||part.length<=0||part.length+kerf>stock)throw Error('Controleer lengte '+part.length+' mm tegenover staaf '+stock+' mm.');let bar=bars.find(x=>x.used+part.length+kerf<=stock);if(!bar){bar={used:0,parts:[]};bars.push(bar)}bar.parts.push(part);bar.used+=part.length+kerf}bars.forEach((bar,i)=>bar.parts.forEach((part,j)=>result.push({part,profile,bar:i+1,total:bars.length,position:j+1,barCount:bar.parts.length,stock,kerf,used:bar.used,done:false})))}return result}
function openProject(p){if(!p||typeof p.name!=='string'||!Array.isArray(p.pieces))throw Error('Ongeldig projectbestand.');const made=build(p);project=p;steps=made;index=0;progressKey='zaagapp-v1-'+encodeURIComponent(p.name)+'-'+p.pieces.length+'-'+p.pieces.reduce((n,x)=>n+Number(x.qty||0),0);try{const saved=JSON.parse(localStorage.getItem(progressKey)||'null');if(saved&&saved.done?.length===steps.length){steps.forEach((x,i)=>x.done=!!saved.done[i]);index=Math.max(0,Math.min(steps.length-1,Number(saved.index)||0))}}catch(e){}$('name').textContent=p.name;$('details').textContent=steps.length+' zaagsneden · staaf '+(p.stock||6000)+' mm';$('list').innerHTML=p.pieces.map(x=>'<div class="item"><b>'+escapeHtml(x.qty)+' × '+escapeHtml(x.length)+' mm</b><div>'+escapeHtml([x.material,x.shape,x.size].filter(Boolean).join(' · '))+'</div><small>'+escapeHtml(angleLabel(x.angles))+'</small></div>').join('');$('project').classList.remove('hidden');$('cut').classList.add('hidden');$('project').scrollIntoView({behavior:'smooth'})}
function save(){try{localStorage.setItem(progressKey,JSON.stringify({index,done:steps.map(x=>x.done)}))}catch(e){}}
function render(){if(!steps.length)return;const x=steps[index],done=steps.filter(x=>x.done).length;$('count').textContent='Stuk '+(index+1)+' van '+steps.length+' · '+done+' afgewerkt';$('bar').style.width=(done/steps.length*100)+'%';$('profile').textContent=x.profile;$('stock').textContent='Staaf '+x.bar+' van '+x.total+' · handelslengte '+x.stock+' mm';$('length').textContent=x.part.length+' mm';$('angle').textContent=x.part.cutSide?'Verstek: '+x.part.cutSide+' ('+x.part.angles+')':'Verstek: '+x.part.angles;$('position').textContent='Stuk '+x.position+' van '+x.barCount+' op deze staaf · restlengte ca. '+Math.max(0,Math.round(x.stock-x.used))+' mm';$('done').textContent=x.done?'✓ Reeds gezaagd · Volgende':'✓ Gezaagd · Volgende';$('prev').disabled=index===0;$('next').disabled=index===steps.length-1}
$('start').onclick=()=>{if(!steps.length)return alert('Geen stukken om te zagen.');$('cut').classList.remove('hidden');render();$('cut').scrollIntoView({behavior:'smooth'})};
$('done').onclick=()=>{steps[index].done=true;if(index<steps.length-1)index++;save();render();if(steps.every(x=>x.done))alert('Alle stukken afgewerkt!')};
$('prev').onclick=()=>{index=Math.max(0,index-1);save();render()};
$('next').onclick=()=>{index=Math.min(steps.length-1,index+1);save();render()};
$('back').onclick=()=>$('cut').classList.add('hidden');
</script></body></html>
